# =============================================================================
# Render Deployment Configuration
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # API Backend (NestJS + Prisma + PostgreSQL)
  # ---------------------------------------------------------------------------
  - type: web
    name: shop-attendance-api
    runtime: node
    region: frankfurt
    rootDir: .deploy/api
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true

  # ---------------------------------------------------------------------------
  # Frontend Dashboard (Next.js) - built from monorepo root
  # ---------------------------------------------------------------------------
  - type: web
    name: shop-attendance-dashboard
    runtime: node
    region: frankfurt
    # NO rootDir — build from repo root so monorepo deps resolve
    buildCommand: npm install && bash apps/admin-dashboard/scripts/prebuild.sh && npm run build:dashboard
    startCommand: cd apps/admin-dashboard && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
    autoDeploy: true
