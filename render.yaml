# =============================================================================
# Render Deployment Configuration
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # API Backend (NestJS + Prisma + PostgreSQL)
  # ---------------------------------------------------------------------------
  - type: web
    name: shop-attendance-api
    runtime: node
    region: frankfurt
    # Build from repo root (monorepo), no .deploy/api needed
    buildCommand: npm install && cd apps/api && npx prisma generate && cd ../.. && npm run build:api
    startCommand: cd apps/api && node dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
    autoDeploy: true

  # ---------------------------------------------------------------------------
  # Frontend Dashboard (Next.js)
  # ---------------------------------------------------------------------------
  - type: web
    name: shop-attendance-dashboard
    runtime: node
    region: frankfurt
    # Build from apps/admin-dashboard (where tsconfig.json with @/ alias lives)
    buildCommand: npm install && bash apps/admin-dashboard/scripts/prebuild.sh && cd apps/admin-dashboard && npm run build
    startCommand: cd apps/admin-dashboard && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
    autoDeploy: true
