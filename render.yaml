# =============================================================================
# Render Deployment Configuration
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # API Backend (NestJS + Prisma + PostgreSQL)
  # ---------------------------------------------------------------------------
  - type: web
    name: shop-attendance-api
    runtime: node
    region: frankfurt
    buildCommand: npm install && npm run prisma:migrate:deploy --workspace=apps/api && npm run build:api
    startCommand: npm run start:prod --workspace=apps/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://shop-attendance-dashboard.onrender.com
    autoDeploy: true

  # ---------------------------------------------------------------------------
  # Frontend Dashboard (Next.js)
  # ---------------------------------------------------------------------------
  - type: web
    name: shop-attendance-dashboard
    runtime: node
    region: frankfurt
    buildCommand: bash apps/admin-dashboard/scripts/prebuild.sh && npm install --include=dev && cd apps/admin-dashboard && npm run build
    startCommand: cd apps/admin-dashboard && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://shop-attendance-api.onrender.com
    autoDeploy: true
