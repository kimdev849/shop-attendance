# =============================================================================
# Render Deployment Configuration
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # API Backend (NestJS + Prisma + PostgreSQL)
  # ---------------------------------------------------------------------------
  - type: web
    name: shop-attendance-api
    runtime: node
    region: frankfurt
    buildCommand: npm install && npx prisma generate --schema=apps/api/prisma/schema.prisma && rm -rf apps/api/dist && ./node_modules/.bin/tsc -p apps/api/tsconfig.build.json
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
    autoDeploy: true

  # ---------------------------------------------------------------------------
  # Frontend Dashboard (Next.js)
  # ---------------------------------------------------------------------------
  - type: web
    name: shop-attendance-dashboard
    runtime: node
    region: frankfurt
    buildCommand: npm install && bash apps/admin-dashboard/scripts/prebuild.sh && cd apps/admin-dashboard && npm run build
    startCommand: cd apps/admin-dashboard && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
    autoDeploy: true
